<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay Donasi IKA UPI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-8 max-w-md w-full">
    <h1 class="text-xl font-bold text-slate-800">Relay Donasi IKA UPI</h1>
    <p class="text-sm text-slate-500 mt-1">Penerus notifikasi Midtrans ke Google Apps Script.</p>

    <div class="mt-6 rounded-lg bg-emerald-50 border border-emerald-200 px-4 py-3 text-sm text-emerald-700">
      Relay aktif. Endpoint:
      <code class="block mt-1 text-xs font-mono break-all" id="endpoint">/api/notification</code>
    </div>

    <p class="mt-4 text-xs text-slate-500">
      Pasang URL di atas (domain + /api/notification) sebagai
      <b>Payment Notification URL</b> di Dashboard Midtrans.
    </p>
  </div>

  <script>
    document.getElementById('endpoint').textContent = location.origin + '/api/notification';
  </script>
</body>
</html>
