[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/snap"
  to = "/.netlify/functions/snap"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/data"
